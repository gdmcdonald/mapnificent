baseurl: ""
tileUrl: "//cartodb-basemaps-{s}.global.ssl.fastly.net/light_all/{z}/{x}/{y}.png?key=cb1_3mph_1_a608a40c9ea301aa6148b69c"
defaults:
  -
    scope:
      path: ""
      type: "cities"
    values:
      layout: "city"
      permalink: "/:slug/"

collections:
  cities:
    output: true
    permalink: /:path/


plugins:
  - jekyll-redirect-from

# Ignore our `vendor` folder from Bundler
# https://github.com/jekyll/jekyll/issues/5267#issuecomment-241379902
exclude: [vendor, _cities/**/scripts, __cities, _cities/**/data, node_modules, src, dist]
